services:

  db:
    build:
      context: ./database
    

    ports:
      - "5432:5432"
    volumes:
      - /home/db-data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword

    networks:
      - appnet

  backend:
    build:
      context: ./backend

    

    ports:
      - "5555:5555"

    env_file:
      - ./backend/.env

    depends_on:
      - db

    networks:
      - appnet

  frontend:
    build:
      context: ./frontend

    

    ports:
      - "3000:3000"

    depends_on:
      - backend

    networks:
      - appnet

networks:
  appnet:
